# Grafana 数据源配置
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST

  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    database: neurominecraft
    user: nmg
    secureJsonData:
      password: nmg_secret
    jsonData:
      timeInterval: "10s"
      httpMethod: GET
