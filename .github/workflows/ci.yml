name: NeuroMinecraft Genesis CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  MIN_PYTHON_VERSION: "3.8"

jobs:
  # 环境检查和依赖测试
  environment-check:
    name: 🔍 环境检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: 📥 Checkout代码
      uses: actions/checkout@v4
      
    - name: 🐍 设置Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 缓存pip依赖
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          ${{ runner.os }}-pip-test-
          
    - name: 🔄 更新pip
      run: |
        python -m pip install --upgrade pip
        
    - name: 📋 检查requirements.txt
      run: |
        if [ ! -f "requirements.txt" ]; then
          echo "❌ requirements.txt 文件不存在"
          exit 1
        fi
        echo "✅ requirements.txt 文件存在"
        
    - name: 🔍 运行环境检查脚本
      run: |
        if [ -f "check_environment.py" ]; then
          python check_environment.py || echo "⚠️ 环境检查发现问题，但继续测试"
        else
          echo "⚠️ 未找到 check_environment.py"
        fi
        
    - name: 🧪 测试核心导入
      run: |
        python -c "
        import sys
        sys.path.append('.')

        # 测试核心模块
        core_modules = [
            'core.brain',
            'core.quantum',
            'core.evolution',
            'core.quantum_brain',
            'core.symbolic',
            'core.algorithm_discovery',
            'agents.single',
            'agents.multi',
            'worlds.procgen'
        ]

        failed_modules = []
        for module in core_modules:
            try:
                __import__(module)
                print(f'✅ {module}')
            except ImportError as e:
                print(f'❌ {module}: {e}')
                failed_modules.append(module)
            except Exception as e:
                print(f'⚠️ {module}: {str(e)[:100]}')

        if failed_modules:
            print(f'\\n⚠️ {len(failed_modules)} 个模块导入失败')
        else:
            print('\\n✅ 所有核心模块导入成功')
        "
        
    - name: 📊 生成检查报告
      if: always()
      run: |
        echo "## 🔍 环境检查结果" > environment_report.md
        echo "- Python版本: $(python --version)" >> environment_report.md
        echo "- 平台: $(uname -a)" >> environment_report.md
        echo "- 时间: $(date)" >> environment_report.md
        echo "- 状态: ${{ job.status }}" >> environment_report.md
        
    - name: 📤 上传检查报告
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: environment-check-report
        path: environment_report.md

  # 多Python版本测试
  multi-version-test:
    name: 🐍 Python ${{ matrix.python-version }} 测试
    runs-on: ${{ matrix.os }}
    needs: environment-check
    timeout-minutes: 20
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
        os: [ubuntu-latest]
        
    steps:
    - name: 📥 Checkout代码
      uses: actions/checkout@v4
      
    - name: 🐍 设置Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: 📦 缓存pip依赖
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-py${{ matrix.python-version }}-pip-
          
    - name: 📦 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt --timeout 300 || echo "部分依赖安装失败，继续测试"
        
    - name: 🧪 核心功能测试
      run: |
        python -c "
        # 基础库测试
        try:
            import numpy as np
            print(f'NumPy {np.__version__} - OK')
        except Exception as e:
            print(f'NumPy - FAIL: {e}')
            
        try:
            import pandas as pd
            print(f'Pandas {pd.__version__} - OK')
        except Exception as e:
            print(f'Pandas - FAIL: {e}')
            
        try:
            import matplotlib
            print(f'Matplotlib {matplotlib.__version__} - OK')
        except Exception as e:
            print(f'Matplotlib - FAIL: {e}')
            
        try:
            import torch
            print(f'PyTorch {torch.__version__} - OK')
        except Exception as e:
            print(f'PyTorch - FAIL: {e}')
            
        try:
            import streamlit
            print(f'Streamlit {streamlit.__version__} - OK')
        except Exception as e:
            print(f'Streamlit - FAIL: {e}')
        "
        
    - name: 🖥️ 可视化组件测试
      run: |
        python -c "
        from importlib import import_module
        
        visualization_libs = ['plotly', 'bokeh', 'seaborn']
        for lib in visualization_libs:
            try:
                module = import_module(lib)
                version = getattr(module, '__version__', 'unknown')
                print(f'{lib} {version} - OK')
            except Exception as e:
                print(f'{lib} - FAIL: {e}')
        "
        
    - name: 🌐 网络组件测试
      run: |
        python -c "
        from importlib import import_module
        
        network_libs = ['requests', 'websocket', 'websockets']
        for lib in network_libs:
            try:
                module = import_module(lib)
                version = getattr(module, '__version__', 'unknown')
                print(f'{lib} {version} - OK')
            except Exception as e:
                print(f'{lib} - FAIL: {e}')
        "

  # 项目结构完整性检查
  structure-check:
    name: 📁 项目结构检查
    runs-on: ubuntu-latest
    needs: environment-check
    timeout-minutes: 5
    
    steps:
    - name: 📥 Checkout代码
      uses: actions/checkout@v4
      
    - name: 📋 检查必需文件
      run: |
        echo "🔍 检查项目结构..."
        echo "当前目录: $(pwd)"

        required_files=(
            "requirements.txt"
            "quickstart.py"
            "check_environment.py"
            "setup.py"
            "README.md"
            "core/__init__.py"
            "core/brain/__init__.py"
            "core/quantum_brain/__init__.py"
            "agents/__init__.py"
            "agents/evolution/disco_rl_agent.py"
            "utils/__init__.py"
            "utils/visualization/__init__.py"
            "tests/__init__.py"
            "tests/unit/__init__.py"
            "examples/__init__.py"
            "Dockerfile"
            "docker-compose.yml"
        )

        optional_files=(
            "worlds/minecraft/server/paper-1.21.8-60.jar"
            ".github/workflows/ci.yml"
            ".github/dependabot.yml"
            "LICENSE"
            "static/brain_network.html"
            "static/evolution_tree.html"
            "config/prometheus.yml"
        )
        
        missing_required=0
        missing_optional=0
        
        echo ""
        echo "📄 必需文件检查:"
        for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
                echo "  ✅ $file"
            else
                echo "  ❌ $file (缺失)"
                ((missing_required++))
            fi
        done
        
        echo ""
        echo "📄 可选文件检查:"
        for file in "${optional_files[@]}"; do
            if [ -f "$file" ]; then
                echo "  ✅ $file"
            else
                echo "  ⚠️ $file (缺失)"
                ((missing_optional++))
            fi
        done
        
        echo ""
        if [ $missing_required -eq 0 ]; then
            echo "✅ 所有必需文件都存在"
        else
            echo "❌ 缺少 $missing_required 个必需文件"
            exit 1
        fi
        
        if [ $missing_optional -gt 0 ]; then
            echo "⚠️ 缺少 $missing_optional 个可选文件"
        else
            echo "✅ 所有推荐文件都存在"
        fi
        
    - name: 🗂️ 检查目录结构
      run: |
        echo "📂 检查目录结构..."
        
        required_dirs=(
            "utils"
            "agents"
            "worlds"
            "utils/visualization"
            "worlds/minecraft"
        )
        
        for dir in "${required_dirs[@]}"; do
            if [ -d "$dir" ]; then
                echo "  ✅ $dir/"
            else
                echo "  ❌ $dir/ (缺失)"
                exit 1
            fi
        done
        
        echo "✅ 目录结构完整"

  # Minecraft服务器测试
  minecraft-server-test:
    name: 🎮 Minecraft服务器测试
    runs-on: ubuntu-latest
    needs: structure-check
    timeout-minutes: 15
    
    steps:
    - name: 📥 Checkout代码
      uses: actions/checkout@v4
      
    - name: ☕ 安装Java 21
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'
        
    - name: 📂 打印当前工作目录
      run: |
        echo "当前工作目录：$(pwd)"
        ls -la worlds/minecraft/server/ || echo "worlds/minecraft/server/ 不存在，将在后续步骤创建"
        
    - name: ⬇️ 下载PaperMC服务器核心
      run: |
        JAR_DIR="worlds/minecraft/server"
        DOWNLOAD_URL="https://api.papermc.io/v2/projects/paper/versions/1.21/builds/60/downloads/paper-1.21-60.jar"
        
        mkdir -p "$JAR_DIR"
        
        if [ ! -f "$JAR_DIR/paper-1.21.8-60.jar" ]; then
          echo "📥 正在下载并重命名 paper-1.21.8-60.jar..."
          curl -L -o "$JAR_DIR/paper-1.21.8-60.jar" "$DOWNLOAD_URL"
          if [ $? -ne 0 ]; then
            echo "❌ 下载失败. 请检查URL或网络连接."
            exit 1
          fi
        else
          echo "✅ paper-1.21.8-60.jar 已存在，跳过下载"
        fi
        
    - name: 🔍 检查 paper-1.21.8-60.jar 文件
      run: |
        PAPER_JAR="worlds/minecraft/server/paper-1.21.8-60.jar"
        if [ -f "$PAPER_JAR" ]; then
          echo "✅ paper-1.21.8-60.jar 文件已存在"
        else
          echo "❌ paper-1.21.8-60.jar 文件缺失"
          exit 1
        fi

    - name: ⚙️ 配置服务器
      run: |
        cd worlds/minecraft/server
        
        if [ ! -f "server.properties" ]; then
          printf 'server-name=NeuroMinecraft\nserver-port=25565\nmax-players=10\nmotd=NeuroMinecraft Genesis Test Server\nonline-mode=false\nallow-nether=true\nallow-flight=false\nallow-cheats=true\nmax-world-size=10000\nannounce-player-achievements=true\nenable-query=true\nenable-rcon=false\nbroadcast-rcon-to-ops=true\nforce-gamemode=false\nforce-difficulty-locked=false\npvp=true\ngenerate-structures=true\nop-permission-level=4\nresource-pack=\nresource-pack-prompt=\nresource-pack-id=\nsync-player-chunk=true\nfunction-permission-level=2\ninitial-enabled-packs=vanilla\n' > server.properties
          echo "✅ 创建server.properties"
        else
          echo "✅ server.properties 已存在，跳过创建"
        fi
        
        if [ ! -f "eula.txt" ]; then
          echo "eula=true" > eula.txt
          echo "✅ 自动同意EULA"
        else
          echo "✅ EULA文件已存在"
        fi
        
    - name: 🚀 测试服务器启动
      run: |
        cd worlds/minecraft/server
        echo "🔧 测试PaperMC启动 (60秒超时)..."
        timeout 60s java -Xms1G -Xmx1G -XX:+UseG1GC -jar paper-1.21.8-60.jar --nogui || echo "⏰ 服务器启动测试完成"
        
    - name: 📊 测试结果
      if: always()
      run: |
        echo "## 🎮 Minecraft服务器测试结果" > minecraft_test_report.md
        echo "- 状态: ${{ job.status }}" >> minecraft_test_report.md
        echo "- Java版本: $(java -version 2>&1 | head -n 1)" >> minecraft_test_report.md
        echo "- PaperMC: $(ls -la worlds/minecraft/server/paper-1.21.8-60.jar 2>/dev/null | awk '{print $5}' || echo '缺失')" >> minecraft_test_report.md
        
    - name: 📤 上传测试报告
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: minecraft-test-report
        path: minecraft_test_report.md

  # 可视化界面测试
  visualization-test:
    name: 📊 可视化界面测试
    runs-on: ubuntu-latest
    needs: environment-check
    timeout-minutes: 10
    
    steps:
    - name: 📥 Checkout代码
      uses: actions/checkout@v4
      
    - name: 🐍 设置Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 安装核心依赖
      run: |
        python -m pip install --upgrade pip
        pip install streamlit plotly bokeh pandas matplotlib
        
    - name: 📋 检查可视化文件
      run: |
        visualization_files=(
            "utils/visualization/dashboard.py"
            "utils/visualization/visualizers.py"
            "utils/visualization/__init__.py"
            "static/brain_network.html"
            "static/evolution_tree.html"
        )

        echo "🔍 检查可视化文件:"
        for file in "${visualization_files[@]}"; do
            if [ -f "$file" ]; then
                echo "  ✅ $file"
            else
                echo "  ⚠️ $file (缺失)"
            fi
        done

    - name: 🧪 测试可视化模块导入
      run: |
        python -c "
        import os
        import sys

        sys.path.append('.')

        viz_modules = [
            'utils.visualization',
            'utils.visualization.dashboard',
            'utils.visualization.visualizers'
        ]

        for module in viz_modules:
            try:
                __import__(module)
                print(f'✅ {module}')
            except Exception as e:
                print(f'⚠️ {module}: {str(e)[:80]}')
        "
            except Exception as e:
                print(f'⚠️ Streamlit仪表板导入问题: {e}')
        else:
            print('ℹ️ utils/visualization/streamlit_dashboard.py 不存在，跳过导入测试')
        "
        
    - name: 📱 生成可视化测试报告
      if: always()
      run: |
        echo "## 📊 可视化测试结果" > visualization_test_report.md
        echo "- 状态: ${{ job.status }}" >> visualization_test_report.md
        echo "- Streamlit: $(pip show streamlit | grep Version || echo '未安装')" >> visualization_test_report.md
        echo "- Plotly: $(pip show plotly | grep Version || echo '未安装')" >> visualization_test_report.md
        
    - name: 📤 上传测试报告
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: visualization-test-report
        path: visualization_test_report.md

  # 代码质量检查
  code-quality:
    name: 🔍 代码质量检查
    runs-on: ubuntu-latest
    needs: environment-check
    timeout-minutes: 10
    
    steps:
    - name: 📥 Checkout代码
      uses: actions/checkout@v4
      
    - name: 🐍 设置Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 安装检查工具
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black mypy
        
    - name: 🔍 检查Python语法
      run: |
        echo "🔍 检查Python文件语法..."
        find . -name "*.py" -type f | head -20 | while read file; do
            python -m py_compile "$file" && echo "  ✅ $file" || echo "  ❌ $file"
        done
        
    - name: 🎨 代码格式检查
      if: always()
      run: |
        if command -v flake8 &> /dev/null; then
          echo "🔍 运行Flake8代码质量检查..."
          flake8 --version
          flake8 --max-line-length=100 --exclude=venv,__pycache__,.git . || echo "⚠️ 代码风格问题已检测"
        else
          echo "ℹ️ Flake8未安装，跳过代码风格检查"
        fi
        
    - name: 📝 生成质量报告
      if: always()
      run: |
        echo "## 🔍 代码质量检查结果" > quality_report.md
        echo "- 状态: ${{ job.status }}" >> quality_report.md
        echo "- Flake8: $(flake8 --version 2>/dev/null || echo '未安装')" >> quality_report.md
        echo "- Python: $(python --version)" >> quality_report.md
        
    - name: 📤 上传质量报告
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-quality-report
        path: quality_report.md

  # 集成测试
  integration-test:
    name: 🔗 集成测试
    runs-on: ubuntu-latest
    needs: [environment-check, structure-check]
    timeout-minutes: 15
    
    steps:
    - name: 📥 Checkout代码
      uses: actions/checkout@v4
      
    - name: 🐍 设置Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 安装基础依赖
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas matplotlib torch streamlit plotly requests
        
    - name: 🧪 测试项目启动
      run: |
        if [ -f "quickstart.py" ]; then
          echo "🔧 测试quickstart.py..."
          timeout 60s python quickstart.py || echo "⏰ quickstart.py测试完成"
        else
          echo "⚠️ quickstart.py不存在"
        fi
        
    - name: 🧪 测试导入核心模块
      run: |
        python -c "
        print('🔍 测试核心模块集成...')

        import sys
        from pathlib import Path

        project_root = Path.cwd()
        sys.path.insert(0, str(project_root))

        try:
            import numpy as np
            print(f'✅ NumPy {np.__version__}')

            import pandas as pd
            print(f'✅ Pandas {pd.__version__}')

            import torch
            print(f'✅ PyTorch {torch.__version__}')

            core_modules = [
                'core.brain',
                'core.quantum_brain',
                'core.symbolic',
                'core.algorithm_discovery',
                'agents.single',
                'agents.multi',
                'utils.visualization',
                'utils.api'
            ]

            for module in core_modules:
                try:
                    __import__(module)
                    print(f'✅ {module}')
                except ImportError as e:
                    print(f'⚠️ {module} (导入失败: {str(e)[:50]})')

        except Exception as e:
            print(f'❌ 集成测试失败: {e}')
            sys.exit(1)
        "

    - name: 🧪 运行pytest测试套件
      run: |
        echo "🔍 运行pytest测试..."
        pip install pytest pytest-cov || echo "⚠️ pytest安装失败"
        if [ -d "tests" ]; then
          python -m pytest tests/ -v --tb=short || echo "⚠️ 部分测试失败"
        else
          echo "⚠️ tests目录不存在"
        fi

    - name: 📊 生成集成测试报告
      if: always()
      run: |
        echo "## 🔗 集成测试结果" > integration_report.md
        echo "- 状态: ${{ job.status }}" >> integration_report.md
        echo "- 核心模块: 测试完成" >> integration_report.md
        echo "- 时间: $(date)" >> integration_report.md
        
    - name: 📤 上传测试报告
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-report
        path: integration_report.md

  # 最终结果汇总
  final-report:
    name: 📋 最终报告
    runs-on: ubuntu-latest
    needs: [environment-check, multi-version-test, structure-check, minecraft-server-test, visualization-test, code-quality, integration-test]
    if: always()
    
    steps:
    - name: 📥 Download所有报告
      uses: actions/download-artifact@v4
      
    - name: 📋 合并测试报告
      run: |
        echo "# 🏁 NeuroMinecraft Genesis CI/CD 最终报告" > final_report.md
        echo "" >> final_report.md
        echo "## 📊 任务执行状态" >> final_report.md
        echo "- 环境检查: ${{ needs.environment-check.result }}" >> final_report.md
        echo "- 多版本测试: ${{ needs.multi-version-test.result }}" >> final_report.md
        echo "- 结构检查: ${{ needs.structure-check.result }}" >> final_report.md
        echo "- Minecraft测试: ${{ needs.minecraft-server-test.result }}" >> final_report.md
        echo "- 可视化测试: ${{ needs.visualization-test.result }}" >> final_report.md
        echo "- 代码质量: ${{ needs.code-quality.result }}" >> final_report.md
        echo "- 集成测试: ${{ needs.integration-test.result }}" >> final_report.md
        echo "" >> final_report.md
        echo "## 📈 测试摘要" >> final_report.md
        echo "- 时间: $(date)" >> final_report.md
        echo "- 平台: ${{ runner.os }}" >> final_report.md
        echo "- Python: ${{ env.PYTHON_VERSION }}" >> final_report.md
        echo "" >> final_report.md
        echo "## 🔍 详细报告" >> final_report.md
        echo "请查看各个测试任务的artifacts获取详细结果。" >> final_report.md
        
    - name: 📤 上传最终报告
      uses: actions/upload-artifact@v4
      with:
        name: final-ci-report
        path: final_report.md
        
    - name: 🎯 设置结果状态
      run: |
        if [[ "${{ needs.environment-check.result }}" == "success" && 
              "${{ needs.structure-check.result }}" == "success" ]]; then
          echo "✅ 核心功能正常"
        else
          echo "❌ 核心功能存在问题"
        fi
